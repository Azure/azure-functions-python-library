jobs:
  - job: "Build"
    displayName: 'Build Python SDK'

    pool:
      name: 1es-pool-azfunc
      image: 1es-ubuntu-22.04
      os: linux

    templateContext:
      outputParentDirectory: $(Build.ArtifactStagingDirectory)
      outputs:
        - output: pipelineArtifact
          targetPath: $(Build.SourcesDirectory)
          artifactName: "azure-functions"

    steps:
      - task: PipAuthenticate@1
        displayName: 'Authenticate to CFS'
        inputs:
          artifactFeeds: 'public/upstream-public'
          onlyAddExtraIndex: false
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.11"
      - bash: |
          python --version
        displayName: 'Check python version'
      - bash: |
          python -m pip install -U pip
          python -m pip install build
          python -m build
        displayName: 'Build Python SDK'
      - template: /eng/templates/steps/generate-component-governance-requirements.yml@self
